[project]
name = "fire-demand-horizon"
version = "0.1.0"
description = "Forecast horizon for fire and rescue service incident demand in England"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "lxml>=5.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "netcdf4>=1.7.5.1.post1",
    "geopandas>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    # Notebook kernel. Declared so that uv sync does not remove it.
    "ipykernel>=6.29",
    # Only scripts/benchmark_reader.py, for the pandas comparison.
    "odfpy>=1.4.1",
    # Plots in the inspection notebooks.
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdh"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
