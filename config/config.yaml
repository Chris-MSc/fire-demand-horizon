# PE7046 configuration.

paths:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  reports_dir: "reports"

sources:
  # Publisher: Ministry of Housing, Communities and Local Government.
  # Licence: Open Government Licence v3.0.
  # Identity is the URL and the SHA-256.
  mhclg_daily_incidents:
    - era: "2010-11_to_2016-17"
      filename: "Daily_incident_dataset_201011_to_201617.ods"
      url: "https://assets.publishing.service.gov.uk/media/6a5e75c64763c49e9be69410/Daily_incident_dataset_201011_to_201617.ods"
      sha256: "63f2ec6efd4f9ca57b22e222ea8798a2f191345adae26b46da2bbfe925b7bc1a"
      # Basis: URL checked against the GOV.UK publication page. Content length
      # 18,240,097 bytes, matching the file on disk. Hash of the file on disk
      # as recorded in data/raw/manifest.json on 8 November 2026.
    - era: "2017-18_to_2022-23"
      filename: "Daily_incident_dataset_201718_to_202223.ods"
      url: "https://assets.publishing.service.gov.uk/media/6a5e75b230f5842e1f5a5eec/Daily_incident_dataset_201718_to_202223.ods"
      sha256: "23fcd555cf83fada725d9b1f174a24a76709389be92921d5fa9d088ca798a924"
      # Basis: URL checked against the GOV.UK publication page. Content length
      # 15,157,593 bytes, matching the file on disk. Hash of the file on disk
      # as recorded in data/raw/manifest.json on 8 November 2026.
    - era: "2023-24_to_present"
      filename: "Daily_incident_dataset_202324_to_present.ods"
      url: "https://assets.publishing.service.gov.uk/media/6a5e759930f5842e1f5a5eeb/Daily_incident_dataset_202324_to_present.ods"
      sha256: "a034f01def8aeb6b1cca4ed34633861c298443486fdb576b438712121c1992ec"
      # Basis: verified against the published file on 3 October 2026.
  ons_fra_boundaries:
    # Office for National Statistics, Open Geography Portal. Feature server
    # layer metadata read 8 November 2026: geometry polygon, native spatial
    # reference EPSG:27700, maxRecordCount 2000, properties FRA22CD, FRA22NM,
    # BNG_E, BNG_N, LONG, LAT, 44 features.
    #
    # December 2022 is the latest England edition found. December 2023, 2024
    # and 2025 England layers do not resolve under the same naming pattern.
    # The only boundary event inside 2010 to 2025 is the April 2016 Dorset and
    # Wiltshire merger, which the incident data already presents as merged
    # throughout, so a fixed snapshot is a stated limitation rather than a gap.
    - era: "fra_2022_en_bgc"
      filename: "fra_2022_en_bgc.geojson"
      url: "https://services1.arcgis.com/ESMARspQHYMw9BZ9/arcgis/rest/services/Fire_and_Rescue_Authorities_December_2022_EN_BGC/FeatureServer/0"
      # Generalised to 20 m and clipped to mean high water. Adequate against a
      # 1 km grid and smaller to hold than the full resolution version.
    - era: "fra_2022_en_bfc"
      filename: "fra_2022_en_bfc.geojson"
      url: "https://services1.arcgis.com/ESMARspQHYMw9BZ9/arcgis/rest/services/Fire_and_Rescue_Authorities_December_2022_EN_BFC/FeatureServer/0"
      # Full resolution, clipped to mean high water. Held for the sensitivity
      # check on generalisation.
  ons_fra_classification:
    - era: "fra_2025_ruc21_ew"
      filename: "fra_2025_ruc21_ew.json"
      url: "https://services1.arcgis.com/ESMARspQHYMw9BZ9/ArcGIS/rest/services/250611_Fire_and_Rescue_Areas_EW/FeatureServer/0"
      # Rural Urban Classification 2021 applied to fire and rescue areas.
      # Attribute table, no geometry, England and Wales. Layer metadata read
      # 8 November 2026: 47 rows keyed FRA25CD, carrying the fields listed in
      # fdh.contract.CLASSIFICATION_FIELDS.
      #
      # FRA25 codes. Hampshire and Isle of Wight is E31000048 here and
      # E31000017 in the incident data, the same mismatch the service
      # crosswalk handles.

boundaries:
  # Which layer under sources.ons_fra_boundaries the cell mask is built from.
  # The generalised layer is adequate against a 1 km grid; the full resolution
  # layer is held for the sensitivity check on generalisation.
  layer: "fra_2022_en_bgc"
  # Boundary polygons folded into another territory to match how the incident
  # data is published. Not derivable from either source.
  merged:
    - boundary_code: "E31000039"
      boundary_name: "Isles of Scilly"
      e_code_territory: "E31000008"
      frs_territory: "Cornwall and Isles of Scilly"
      source: >-
        Fire statistics incident level datasets, dataset guidance: Isles of
        Scilly is merged with Cornwall for data protection reasons given the
        minimal number of incidents, 16 fires across 2010/11 to 2024/25. The
        boundary layer carries Isles of Scilly as its own polygon, so the
        merge is applied to the boundaries to match the incident data.

panel:
  # Undecided. Selection criteria are stated in the proposal; the panel itself
  # is not fixed and is task 2.1 under Objective 2.
  services: null
  # Undecided. The panel is selected on RUC21_settlement_class from the
  # ons_fra_classification source. Which classes qualify is set in task 2.1.
  # Observed distribution across England and Wales: Majority rural 3,
  # Intermediate rural 11, Intermediate urban 13, Urban 20.
  rural_urban_classes: null
  # Basis: record level incident data begin with financial year 2010-11;
  # earlier records are not published at record level.
  start_date: "2010-04-01"
  # Three reasons, in order.
  #
  # 31 October is a seasonal boundary. The span gives sixteen complete warm
  # seasons, April to October 2010 through 2025, and fifteen complete cold
  # seasons, November to March 2010/11 through 2024/25. The two weather
  # mechanisms under test sit in opposite halves of the year, so a partial
  # season would bias one and not the other.
  #
  # The Incident Recording System ran until November 2025 and the Fire and
  # Rescue Data Platform since. Ending on 31 October stops before the change
  # whichever day in November it fell on, and the published guidance gives
  # only the month.
  #
  # The weather release covers to 31 December 2025, so every target date has
  # weather behind it.
  #
  # Cost is 151 days, 2.6% of the recorded span.
  end_date: "2025-10-31"

incident_types:
  # All eleven published types are modelled. The question concerns the four
  # with identifiable weather mechanisms (secondary for dryness, chimney and
  # dwelling for cold, apparatus false alarms as the no-mechanism case), but
  # horizons are estimated for every type so those four are compared against
  # the full set rather than against a subset chosen in advance.
  #
  # The cold measure cannot be a frost-day count: airfrost, groundfrost and
  # snowLying are published monthly only, so it derives from tasmin. Wind and
  # humidity have no daily proxy at all, which bears on road traffic
  # collisions inside Non-fire incidents.
  modelled_types:
    - "Chimney Fires"
    - "Due to apparatus"
    - "Dwellings"
    - "Good intent"
    - "Malicious"
    - "Non-fire false alarms"
    - "Non-fire incidents"
    - "Other Buildings"
    - "Other Outdoors"
    - "Road Vehicles"
    - "Secondary Fires"
  # Written by the C1 taxonomy check. Until it exists, nothing maps.
  mapping_file: null
  # Written by notebook 01. One row per recorded territory, carrying the
  # matched boundary code and the basis of the match.
  crosswalk_file: "config/service_crosswalk.csv"

horizon:
  # The evaluated lead times, in days. Weekly resolution is reported
  # explicitly as a limitation.
  min_days: 7
  max_days: 84
  step_days: 7
  # Mean absolute scaled error threshold defining the horizon. Applied to the
  # upper bound of the fold-level interval, with contiguity required.
  mase_threshold: 1.0

model:
  # Fixed by the design. Dynamic harmonic regression: Fourier terms with
  # ARMA errors and weather covariates as additional regressors.
  seasonal_period: 7
  # Undecided. Set by exploratory analysis in Objective 2.
  fourier_terms: null
  # restricted: weather observed to the forecast origin only.
  # perfect_foresight: weather observed through to the target date.
  information_condition: "restricted"

benchmark:
  primary: "weekly_seasonal_naive"
  robustness: "annual_seasonal_naive"

validation:
  # Tolerance when reconciling annual counts against published aggregates.
  # Basis: not yet set. Requires FIRE0102 to be opened first.
  reconciliation_tolerance: null
  # Undecided. A series is scored only where its training window holds at
  # least this many days with at least one incident. Known before any model is
  # fitted, so the exclusion is pre-specified rather than chosen after seeing
  # results. Basis comes from the zero day distribution in
  # reports/panel_zero_shares.csv, written by scripts/build_panel.py.
  min_nonzero_days: null
  # Windows where a service did not submit. Nothing in the data separates a
  # day with no incidents from a day never submitted, so the distinction comes
  # from the published guidance. The panel build writes these days as null
  # rather than zero, and they are left out of the zero day shares. This list
  # is the only way a day becomes null. The build also reports territory-days
  # with no incidents of any type to reports/panel_quiet_days.csv, which
  # changes nothing in the panel.
  reporting_gaps:
    - e_code_territory: "E31000034"
      frs_territory: "Suffolk"
      start: "2024-09-01"
      end: "2025-03-31"
      source: >-
        Fire statistics incident level datasets, dataset guidance: Suffolk
        Fire and Rescue Service was unable to submit all incidents for this
        period for technical reasons, and the figures are to be revised.

weather:
  # HadUK-Grid gridded climate observations, 1 km, Met Office via the Centre
  # for Environmental Data Analysis. NetCDF files on the CEDA Archive,
  # available to registered users. There is no query API: whole monthly grids
  # are downloaded and subset locally.
  dataset: "HadUK-Grid v1.3.2.ceda"
  catalogue_uuid: "789b3065d74a4c948ab05d33556c86d0"
  # Provenance strings read from the files themselves on 8 November 2026:
  # source HadUK-Grid_v1.3.2.0, version v20260512. Dataset reference
  # doi: 10.1002/gdj3.78 (Hollis et al.).
  version_directory: "v20260512"
  resolution: "1km"
  frequency: "day"
  # Four of the fifteen variables publish at daily resolution: rainfall, tas,
  # tasmax, tasmin. The other eleven start at monthly and cannot enter a daily
  # panel.
  #
  # tas is excluded: its cell_methods is time: mid_range, so the published
  # mean is the midpoint of tasmax and tasmin by construction. Verified over
  # 7,352,310 cell-days, maximum absolute difference against the derived
  # midpoint 0.0. Excluding it takes the download from 55.7 GB to 41.7 GB.
  variables:
    - "rainfall"
    - "tasmax"
    - "tasmin"
  # Coverage of the annual CEDA release reads 1836 to 2025 in the catalogue
  # record. Anything after 31 December 2025 would come from the Met Office
  # provisional product, which is a separate file with extra compression.
  release_covers_to: "2025-12-31"
  # First day of weather to list, check and download; the window ends at
  # release_covers_to. Accumulated weather covariates reach backwards from the
  # first scored day, so a 90-day rainfall accumulation on the first day of
  # the panel needs weather from three months earlier. Six months of lead-in
  # before panel.start_date covers any candidate window up to 180 days. Cost
  # is eighteen further files, roughly 1.3 GB against the 41.7 GB already
  # sized.
  window_start: "2009-10-01"
  # Archive root for the 1 km product. Directory listings and file downloads
  # under it were verified on 8 November 2026: one month of each of the four
  # daily variables downloaded and opened.
  base_url: "https://dap.ceda.ac.uk/badc/ukmo-hadobs/data/insitu/MOHC/HadOBS/HadUK-Grid/v1.3.2.ceda/1km"
  # Grid read from the files: 900 by 1450 cells on transverse_mercator,
  # EPSG:27700, matching the boundary layer. 245,077 land cells of 1,305,000,
  # identical across variables. Fill value 1e+20 marks sea and cells outside
  # the United Kingdom, excluded from the aggregation rather than averaged in.
  fill_value: 1.0e+20
  # Settled by Hollis et al. (2019) Table 1. Every daily variable is observed
  # over a 09:00 to 09:00 period. The cell_methods comment is correct and the
  # 00:00 time_bnds on the temperature files are nominal calendar labels rather
  # than a description of the observing window, so the files do not disagree
  # with themselves.
  observing_window: "0900_to_0900"
  # Days between the published label and the day the observing window opens.
  # Windows from Hollis et al. (2019) Table 1: tasmax for day D runs 09:00 on
  # D to 09:00 on D+1; rainfall the same; tasmin for day D runs 09:00 on D-1
  # to 09:00 on D. tasmin therefore sits one day earlier than tasmax relative
  # to the published label and the two are not contemporaneous.
  #
  # Two consequences. A cold night prompts heating the following day, so
  # tasmin on its published label is arguably the correct alignment for
  # cold-driven demand. At 09:00 on day D, tasmin for day D is complete while
  # tasmax for day D is not known until 09:00 on D+1, so the two arrive at
  # different freshness under the restricted condition.
  label_offset_days:
    rainfall: 0
    tasmax: 0
    tasmin: -1